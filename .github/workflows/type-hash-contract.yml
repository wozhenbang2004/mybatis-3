name: Validate resolved type hash contract

on:
  push:
    branches: [validation/type-hash-contract]
    paths: [.github/workflows/type-hash-contract.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: type-hash-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'wozhenbang2004/mybatis-3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_SHA: bd5915a99761da58011922d4ce143f840a805cc3
      PATCH_SHA256: 660ea5fc47aefceb7cea178dcb4a4a166b19ebe48aa5af8464be3cb29a6e4926
    steps:
      - name: Check out the fixed upstream baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, as in upstream CI
        with:
          repository: mybatis/mybatis-3
          ref: bd5915a99761da58011922d4ce143f840a805cc3
          persist-credentials: false

      - name: Set up the upstream CI Java version
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0, as in upstream CI
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify baseline and apply the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          patch="$RUNNER_TEMP/type-hashcode-fix.patch"
          cat > "$patch" <<'PATCH'
          --- a/src/main/java/org/apache/ibatis/reflection/TypeParameterResolver.java
          +++ b/src/main/java/org/apache/ibatis/reflection/TypeParameterResolver.java
          @@ -330,11 +330,7 @@
           
               @Override
               public int hashCode() {
          -      final int prime = 31;
          -      int result = 1;
          -      result = prime * result + Arrays.hashCode(lowerBounds);
          -      result = prime * result + Arrays.hashCode(upperBounds);
          -      return result;
          +      return Arrays.hashCode(lowerBounds) ^ Arrays.hashCode(upperBounds);
               }
           
               @Override
          @@ -376,7 +372,7 @@
           
               @Override
               public int hashCode() {
          -      return Objects.hash(genericComponentType);
          +      return Objects.hashCode(genericComponentType);
               }
           
               @Override
          --- a/src/test/java/org/apache/ibatis/reflection/TypeParameterResolverTest.java
          +++ b/src/test/java/org/apache/ibatis/reflection/TypeParameterResolverTest.java
          @@ -41,6 +41,8 @@
           import org.apache.ibatis.reflection.typeparam.Level2Mapper;
           import org.apache.ibatis.type.TypeReference;
           import org.junit.jupiter.api.Test;
          +import org.junit.jupiter.params.ParameterizedTest;
          +import org.junit.jupiter.params.provider.ValueSource;
           
           class TypeParameterResolverTest {
           
          @@ -574,19 +576,29 @@
               assertTrue(typeMybatis instanceof TypeParameterResolver.ParameterizedTypeImpl);
               assertTrue(typeJdk.equals(typeMybatis));
               assertTrue(typeMybatis.equals(typeJdk));
          -  }
          -
          -  @Test
          -  void shouldWildcardTypeBeEqual() throws Exception {
          +    assertEquals(typeJdk.hashCode(), typeMybatis.hashCode());
          +  }
          +
          +  @ParameterizedTest
          +  @ValueSource(strings = { "foo", "lowerBound", "unbounded" })
          +  void shouldWildcardTypeBeEqual(String methodName) throws Exception {
          +    @SuppressWarnings("unused")
               class WildcardTypeTester {
          -      @SuppressWarnings("unused")
                 public List<? extends Serializable> foo() {
                   return null;
                 }
          +
          +      public List<? super Integer> lowerBound() {
          +        return null;
          +      }
          +
          +      public List<?> unbounded() {
          +        return null;
          +      }
               }
           
               Class<?> clazz = WildcardTypeTester.class;
          -    Method foo = clazz.getMethod("foo");
          +    Method foo = clazz.getMethod(methodName);
               Type typeMybatis = TypeParameterResolver.resolveReturnType(foo, clazz);
               Type typeJdk = foo.getGenericReturnType();
           
          @@ -595,8 +607,10 @@
           
               assertTrue(wildcardJdk instanceof WildcardType && !(wildcardJdk instanceof TypeParameterResolver.WildcardTypeImpl));
               assertTrue(wildcardMybatis instanceof TypeParameterResolver.WildcardTypeImpl);
          +    assertEquals(wildcardJdk.hashCode(), wildcardMybatis.hashCode());
               assertTrue(typeJdk.equals(typeMybatis));
               assertTrue(typeMybatis.equals(typeJdk));
          +    assertEquals(typeJdk.hashCode(), typeMybatis.hashCode());
             }
           
             @Test
          @@ -617,6 +631,7 @@
               assertTrue(typeMybatis instanceof TypeParameterResolver.GenericArrayTypeImpl);
               assertTrue(typeJdk.equals(typeMybatis));
               assertTrue(typeMybatis.equals(typeJdk));
          +    assertEquals(typeJdk.hashCode(), typeMybatis.hashCode());
             }
           
             @Test
          PATCH
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | sha256sum --check --strict
          git apply --check "$patch"
          git apply --whitespace=error "$patch"
          git diff --check
          git diff --stat
          sha256sum --check --strict <<'SHA256'
          05d6c1fbb14a1f25f69135e95e0617bc83623e9457c871c4fec326cd95008ecb  src/main/java/org/apache/ibatis/reflection/TypeParameterResolver.java
          6ca0ec0501491888a181a7a1269cb0d7881bd8a9bd1e213f914fa8c942d574cc  src/test/java/org/apache/ibatis/reflection/TypeParameterResolverTest.java
          SHA256

      - name: Validate the official formatter and import sorting
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress formatter:validate impsort:check

      - name: Check Docker availability for the official Linux test profile
        shell: bash
        run: docker info

      - name: Run the full official Linux Maven test command
        shell: bash
        run: ./mvnw test --batch-mode --no-transfer-progress --show-version -D"license.skip=true" -PtestContainers

      - name: Require all resolver cases including the four regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTEST'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('target/surefire-reports/TEST-org.apache.ibatis.reflection.TypeParameterResolverTest.xml')
          if not report.is_file():
              raise SystemExit('Missing resolver Surefire report: the regression suite was not verified.')
          suite = ET.parse(report).getroot()
          cases = suite.findall('testcase')
          expected_class = 'org.apache.ibatis.reflection.TypeParameterResolverTest'
          if len(cases) != 47 or any(c.get('classname') != expected_class for c in cases):
              raise SystemExit(f'Expected 47 resolver cases, got {len(cases)}; refusing an incomplete or unrelated report.')
          if any(int(suite.get(k, '0')) for k in ('failures', 'errors', 'skipped')):
              raise SystemExit('Resolver suite reports failures, errors, or skipped cases.')
          if any(c.find(k) is not None for c in cases for k in ('failure', 'error', 'skipped')):
              raise SystemExit('At least one resolver case failed, errored, or was skipped.')
          def is_method(case, method):
              name = case.get('name', '')
              return name == method or name.startswith(method + '(') or name.startswith(method + '[')
          wildcard = [c.get('name', '') for c in cases if is_method(c, 'shouldWildcardTypeBeEqual')]
          array = [c.get('name', '') for c in cases if is_method(c, 'shouldGenericArrayTypeBeEqual')]
          if len(wildcard) != 3 or len(set(wildcard)) != 3 or len(array) != 1:
              raise SystemExit(f'The four regression invocations were not all executed: {wildcard + array}')
          message = 'Resolver suite: 47 passed, zero skipped; verified regression invocations:\n' + '\n'.join(wildcard + array)
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Resolved type hash contract\n\n')
              summary.write(f"Upstream: `{os.environ['UPSTREAM_SHA']}`  \nPatch SHA-256: `{os.environ['PATCH_SHA256']}`\n\n")
              summary.write('Temurin JDK 25; official Linux `-PtestContainers` command. This resolver result does not override the overall Maven step status.\n\n')
              summary.write('```text\n' + message + '\n```\n')
          PYTEST

      - name: Confirm the tested source is still the reviewed patch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sha256sum --check --strict <<'SHA256'
          05d6c1fbb14a1f25f69135e95e0617bc83623e9457c871c4fec326cd95008ecb  src/main/java/org/apache/ibatis/reflection/TypeParameterResolver.java
          6ca0ec0501491888a181a7a1269cb0d7881bd8a9bd1e213f914fa8c942d574cc  src/test/java/org/apache/ibatis/reflection/TypeParameterResolverTest.java
          SHA256
          python3 - <<'PYDIFF'
          import subprocess
          expected = {
              'src/main/java/org/apache/ibatis/reflection/TypeParameterResolver.java',
              'src/test/java/org/apache/ibatis/reflection/TypeParameterResolverTest.java',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'Unexpected tracked changes after validation: {sorted(actual)}')
          PYDIFF
